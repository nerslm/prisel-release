name: 建议 · Suggestion
description: 想要的功能或改进 · A feature or improvement you want
labels: ["enhancement"]
body:
  - type: textarea
    id: want
    attributes:
      label: 你想做什么？ · What do you want to do?
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: 现在是怎么做的，哪里不方便？ · How do you do it now, and what gets in the way?
